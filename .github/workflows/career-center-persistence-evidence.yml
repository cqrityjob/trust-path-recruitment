name: Career Center persistence — routed browser evidence

# ── WHY THIS IS A WORKFLOW OF ITS OWN ───────────────────────────────────
#
# e2e/career-center-persistence.spec.ts walks the saved profession in the
# RUNNING application, in one tab: A saves a profession in the profile, the
# Career Center shows it without a reload, a reload shows it again, signing
# out leaves nothing of it, B signs in and sees B's own profession, and a new
# sign-in reads A's back. Saving, reading and the isolation between A and B
# are facts about GoTrue, PostgREST and row-level security, so the walk runs
# against a real stack -- a simulated server response cannot prove them.
#
# It cannot live in ci.yml's browser job, which refuses every Supabase host.
# The stack here is started from scratch on the runner, proven to be
# loopback, seeded with synthetic people only, and stopped afterwards.
# Nothing reaches the owner project.
#
# ── A GREEN JOB WHERE THE TESTS SKIPPED IS NOT EVIDENCE ───────────────
#
# The spec skips itself unless E2E_LOCAL_STACK=1 and both URLs are loopback.
# The verify step reads the JSON report and refuses unless every test ran
# and passed on the desktop AND the 375px project
# (scripts/career-center-persistence-evidence-verify.ts).

on:
  pull_request:
    branches:
      - main
      # Pull requests stacked on another claude/* branch are checked too (see ci.yml).
      - "claude/**"
    paths:
      - "src/**"
      - "e2e/career-center-persistence.spec.ts"
      - "scripts/fixtures/career-center-persistence-fixture.sql"
      - "scripts/career-center-persistence-evidence-verify.ts"
      - "supabase/migrations/**"
      - ".github/workflows/career-center-persistence-evidence.yml"
  workflow_dispatch:

# The same pinned CLI as recruitment-evidence.yml and e4-evidence.yml: the
# stack the evidence runs on is part of the evidence.
env:
  SUPABASE_CLI_VERSION: "2.117.0"

permissions:
  contents: read

concurrency:
  group: career-center-persistence-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Career Center persistence browser evidence (isolated local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify the CLI surface
        run: |
          set -euo pipefail
          installed="$(supabase --version)"
          echo "supabase CLI: ${installed} (pinned ${SUPABASE_CLI_VERSION})"
          if [ "${installed}" != "${SUPABASE_CLI_VERSION}" ]; then
            echo "CLI PIN REFUSED: asked for ${SUPABASE_CLI_VERSION}, got ${installed}" >&2
            exit 1
          fi
          supabase --help > /tmp/supabase-help.txt
          for c in start stop status; do
            grep -qE "^[[:space:]]+${c}[[:space:]]" /tmp/supabase-help.txt || { echo "CLI SURFACE REFUSED: no 'supabase ${c}'" >&2; exit 1; }
          done

      # Started with the migration history HELD BACK, as the other evidence
      # workflows do: the history is replayed as `postgres` below, after the
      # privilege baseline is set. Bounded retries across ghcr.io and
      # Supabase's public mirror, because anonymous image pulls are throttled.
      - name: Start the local Supabase stack, history held back
        run: |
          set -euo pipefail
          mv supabase/migrations /tmp/ccp-migrations
          mkdir -p supabase/migrations
          started=0
          for attempt in 1 2 3 4; do
            case "$attempt" in 1|3) registry=ghcr.io ;; *) registry=public.ecr.aws ;; esac
            if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry" supabase start; then
              started=1
              break
            fi
            echo "::warning::supabase start attempt ${attempt} (${registry}) failed"
            supabase stop --no-backup || true
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 30)); fi
          done
          if [ "$started" -ne 1 ]; then
            echo "STACK REFUSED: supabase start failed four times across ghcr.io and public.ecr.aws" >&2
            exit 1
          fi
          rmdir supabase/migrations
          mv /tmp/ccp-migrations supabase/migrations
          test -d supabase/migrations

      - name: Derive the local configuration
        id: local
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase-status.env
          # shellcheck disable=SC1091
          set -a; . /tmp/supabase-status.env; set +a
          # The LOCAL stack's keys, for the app server exactly as the other
          # evidence workflows configure it. They belong to a stack that
          # exists for one job on this runner; the isolation step below
          # refuses any hosted credential. The spec itself needs no key: the
          # person signs in through the /login form.
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_PROJECT_ID=local-career-center-persistence"
            echo "VITE_SUPABASE_PROJECT_ID=local-career-center-persistence"
            echo "VITE_EMPLOYER_PORTAL_ENABLED=true"
            echo "VITE_JOBS_ENABLED=true"
            echo "PUBLIC_SITE_URL=http://localhost:3120"
          } > .env.local
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          echo "db_url=${DB_URL}" >> "$GITHUB_OUTPUT"

      - name: Refuse anything that is not loopback
        env:
          API_URL: ${{ steps.local.outputs.api_url }}
          DB_URL: ${{ steps.local.outputs.db_url }}
        run: |
          set -euo pipefail
          fail() { echo "ISOLATION REFUSED: $1" >&2; exit 1; }
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) : ;;
            *) fail "the Supabase API URL is not loopback: $API_URL" ;;
          esac
          case "$DB_URL" in
            postgresql://*@127.0.0.1:*|postgresql://*@localhost:*) : ;;
            *) fail "the database URL is not loopback: $DB_URL" ;;
          esac
          if grep -q 'wrygicdfxwjnrugduxnt' .env.local; then fail "the owner project ref reached .env.local"; fi
          # The service-role key in .env.local must be the LOCAL stack's own.
          set -a; . /tmp/supabase-status.env; set +a
          if ! grep -qx "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" .env.local; then fail "the service-role key in .env.local is not the local stack's"; fi
          if grep -q 'RESEND_API_KEY' .env.local; then fail "a mail key reached .env.local; this walk sends no e-mail"; fi
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY; do
            if [ -n "${!v:-}" ]; then fail "$v is set; this job must need no hosted credential"; fi
          done
          echo "isolation OK — API $API_URL, DB loopback, no hosted credential present"

      # The same privilege baseline as production: a stock local stack grants
      # every new function to authenticated and service_role by default,
      # which the owner project does not.
      - name: Match the hosted privilege baseline
        env:
          DB_URL: ${{ steps.local.outputs.db_url }}
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            REVOKE EXECUTE ON FUNCTIONS FROM authenticated, service_role;
          SQL

      - name: Replay the migration history
        env:
          DB_URL: ${{ steps.local.outputs.db_url }}
        run: |
          set -euo pipefail
          n=0
          for f in supabase/migrations/*.sql; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f" || { echo "FAILED: $f" >&2; exit 1; }
            n=$((n+1))
          done
          echo "replayed ${n} migration(s)"

      - name: Seed the synthetic fixture
        env:
          DB_URL: ${{ steps.local.outputs.db_url }}
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f scripts/fixtures/career-center-persistence-fixture.sql
          # Run twice: the fixture must be a no-op on a stack that already holds it.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f scripts/fixtures/career-center-persistence-fixture.sql
          psql "$DB_URL" -Atc "SELECT u.email, coalesce(p.current_profession_slug, '(nothing saved)') FROM auth.users u LEFT JOIN public.security_career_profiles p ON p.user_id = u.id WHERE u.email LIKE 'cc-walk-%@local.test' ORDER BY 1"

      - name: Install Chromium
        run: |
          grep -rlZ 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null | xargs -0r sudo rm -f
          bunx playwright install --with-deps chromium

      - name: Start the application against the local stack
        run: |
          set -euo pipefail
          nohup bun run dev -- --port 3120 --strictPort > /tmp/dev-server.log 2>&1 &
          disown
          for i in $(seq 1 90); do
            if curl -sfo /dev/null http://localhost:3120/; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the dev server did not come up"; cat /tmp/dev-server.log; exit 1

      # Serial, one worker: the second test reads back what the first saved.
      - name: Walk the saved profession (desktop and 375px)
        env:
          E2E_LOCAL_STACK: "1"
          E2E_BASE_URL: http://localhost:3120
          E2E_SUPABASE_URL: ${{ steps.local.outputs.api_url }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: |
          set -euo pipefail
          bunx playwright test e2e/career-center-persistence.spec.ts \
            --project=chromium --project=mobile-375 --workers=1 --trace off \
            --reporter=list,json

      - name: Refuse a report where the walk was skipped
        if: always()
        run: bun run scripts/career-center-persistence-evidence-verify.ts

      # The walk's own screenshots, pass or fail: synthetic data only, and no
      # trace is recorded, so nothing here carries a request body or a token.
      - name: Upload the routed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-center-persistence-evidence-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Server log
        if: failure()
        run: tail -n 80 /tmp/dev-server.log || true

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup || true
