# Talent discovery on real Supabase services: the application of THIS pull
# request (not a pinned older app) against a fresh CLI stack with GoTrue,
# Storage, PostgREST and Postgres 17, the full migration history replayed
# strictly, and the eleven browser scenarios of
# e2e/talent-discovery-local.spec.ts. See scripts/talent-discovery-real-ci-run.mjs
# for what is real and what is absent (no Edge runtime: product mail cannot
# leave the runner).
name: Talent discovery real Supabase evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "claude/**"]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "e2e/talent-discovery-local.spec.ts"
      - "scripts/fixtures/talent-discovery-fixture.sql"
      - "scripts/talent-discovery-real-ci*"
      - ".github/workflows/talent-discovery-real-ci.yml"

permissions:
  contents: read

concurrency:
  group: talent-discovery-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  talent_real:
    name: Talent discovery — real GoTrue, Storage, PostgREST and the head app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TD_REAL_DISPOSABLE: 1
      TD_REAL_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Ubuntu archive DNS fallback
        run: |
          # GitHub-hosted runners have repeatedly failed to resolve Ubuntu's package
          # hosts ("Temporary failure resolving 'archive.ubuntu.com'") while every
          # other host resolved, which fails apt and Playwright's --with-deps before
          # a single test runs. When, and only when, the runner's own resolver
          # cannot resolve one of those hosts, look it up over public DNS and pin
          # it in /etc/hosts for this job. The hosts, the archive and apt's
          # signature verification are unchanged; if the public lookup fails too,
          # nothing is pinned and package installation fails exactly as before.
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if getent ahostsv4 "$host" >/dev/null 2>&1; then continue; fi
            ip="$(curl -fsS -m 10 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=${host}&type=A" | jq -r '[.Answer[]? | select(.type == 1) | .data][0] // empty' || true)"
            if printf '%s' "$ip" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
              echo "$ip $host" | sudo tee -a /etc/hosts >/dev/null
              echo "::warning::The runner could not resolve $host; pinned it to $ip from public DNS for this job."
            else
              echo "::warning::The runner could not resolve $host and the public lookup returned nothing; package installation will fail."
            fi
          done

      - name: PostgreSQL client for the strict replay and the fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Frozen dependencies
        run: bun install --frozen-lockfile
      - name: Chromium
        run: bunx playwright install --with-deps chromium
      - name: Isolation and contract guards
        run: bun test ./scripts/talent-discovery-real-ci.test.ts
      - name: Fresh real Supabase, 404-file strict replay, GoTrue accounts, fixture and all 13 browser scenarios (none skipped)
        run: node scripts/talent-discovery-real-ci-run.mjs
      - name: Public manifest and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talent-discovery-real-evidence
          path: |
            td-real-public/manifest.json
            td-real-public/images/*.png
            test-results/**/error-context.md
            test-results/**/test-failed-*.png
          if-no-files-found: warn
          retention-days: 7
