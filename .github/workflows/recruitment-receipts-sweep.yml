# The receipt recovery, on a schedule.
#
# ── WHAT THIS DOES, AND DOES NOT ─────────────────────────────────────
#
# Every quarter of an hour it asks the deployed app, once, to send the
# receipt e-mails that are due: never started, aged out, unknown inside the
# provider's 24-hour idempotency window, rate-limited. The app does the
# work through the database's own recovery (one attempt per receipt,
# bounded, one sweep at a time); this workflow only knocks. It reads no
# database, holds no mail key and generates nothing retroactively.
#
# ── TO ACTIVATE ───────────────────────────────────────────────────────
#
#   1. In the app's server environment (Lovable): RECRUITMENT_SWEEP_TOKEN, a
#      random value of at least 32 characters. The endpoint is a 404 until
#      it is set.
#   2. Repository secrets: RECRUITMENT_SWEEP_TOKEN (the same value) and
#      RECRUITMENT_SWEEP_URL (https://<the deployed app>/api/recruitment/receipts-sweep).
#
# Without the secrets the job says so and does nothing -- a green run that
# did nothing must not look like a run that did, so the summary states it.
name: Recruitment receipts sweep

on:
  schedule:
    # Off the hour and the half hour on purpose: the top of the hour is when
    # every cron on GitHub fires at once and jobs queue behind each other.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recruitment-receipts-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Ask the app to send what is due
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Sweep
        env:
          RECRUITMENT_SWEEP_URL: ${{ secrets.RECRUITMENT_SWEEP_URL }}
          RECRUITMENT_SWEEP_TOKEN: ${{ secrets.RECRUITMENT_SWEEP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RECRUITMENT_SWEEP_URL:-}" ] || [ -z "${RECRUITMENT_SWEEP_TOKEN:-}" ]; then
            echo "NOT CONFIGURED: RECRUITMENT_SWEEP_URL / RECRUITMENT_SWEEP_TOKEN are not set; nothing was swept." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun run scripts/receipts-sweep.ts | tee -a "$GITHUB_STEP_SUMMARY"
