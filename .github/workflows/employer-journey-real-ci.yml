# The employer journey on real Supabase services: the application of THIS
# pull request against a fresh CLI stack with GoTrue (sign-up open, no
# confirmation mail), Storage, PostgREST and Postgres 17, the full migration
# history replayed strictly, and the seven connected browser scenarios of
# e2e/employer-journey-local.spec.ts -- register a company, admin approval,
# job, Passport match, contact, application, the employer's case list.
# See scripts/employer-journey-real-ci-run.mjs for what is real and what is
# absent (no Edge runtime: product mail cannot leave the runner).
name: Employer journey real Supabase evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "claude/**"]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "e2e/employer-journey-local.spec.ts"
      - "scripts/fixtures/employer-journey-fixture.sql"
      - "scripts/employer-journey-real-ci*"
      - "scripts/lib/real-supabase-ci.mjs"
      - "scripts/talent-discovery-real-ci-contract.mjs"
      - "scripts/recruiter-real-ci-contract.mjs"
      - ".github/workflows/employer-journey-real-ci.yml"

permissions:
  contents: read

concurrency:
  group: employer-journey-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  employer_journey_real:
    name: Employer journey — real GoTrue, Storage, PostgREST and the head app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EJ_REAL_DISPOSABLE: 1
      EJ_REAL_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: PostgreSQL client for the strict replay and the fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Frozen dependencies
        run: bun install --frozen-lockfile
      - name: Chromium
        run: bunx playwright install --with-deps chromium
      - name: Isolation and contract guards
        run: bun test ./scripts/employer-journey-real-ci.test.ts
      - name: Fresh real Supabase with open sign-up, strict replay, GoTrue accounts, fixture and all 7 browser scenarios (none skipped)
        run: node scripts/employer-journey-real-ci-run.mjs
      - name: Public manifest and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employer-journey-real-evidence
          path: |
            ej-real-public/manifest.json
            ej-real-public/images/*.png
            test-results/**/error-context.md
            test-results/**/test-failed-*.png
          if-no-files-found: warn
          retention-days: 7
