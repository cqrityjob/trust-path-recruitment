name: Recruiter real Supabase evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "codex/**"]
  push:
    branches: [main, "codex/recruiter-real-ci"]

permissions:
  contents: read

concurrency:
  group: recruiter-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recruiter_real:
    name: Real GoTrue, Storage, PostgREST 14 and snapshot app
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RI_REAL_SCHEMA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RI_REAL_RELEASE_SCHEMA_SHA: 5814706fa338d470aa0d70f04d46a5faad6ae165
      RI_OPS_STACK_ROOT: ${{ github.workspace }}/real-stack
    steps:
      - name: Exact current schema and evidence code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
            e2e
            supabase
      - name: Exact reviewed snapshot application
        uses: actions/checkout@v4
        with:
          ref: 53659419a1c243c27a59540eb849569140b71365
          path: app
          persist-credentials: false
      # The CLI composite installs its own Bun. Restore our reviewed test
      # runtimes afterwards; the runner also checks their actual versions.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Ubuntu archive DNS fallback
        run: |
          # GitHub-hosted runners have repeatedly failed to resolve Ubuntu's package
          # hosts ("Temporary failure resolving 'archive.ubuntu.com'") while every
          # other host resolved, which fails apt and Playwright's --with-deps before
          # a single test runs. When, and only when, the runner's own resolver
          # cannot resolve one of those hosts, look it up over public DNS and pin
          # it in /etc/hosts for this job. The hosts, the archive and apt's
          # signature verification are unchanged; if the public lookup fails too,
          # nothing is pinned and package installation fails exactly as before.
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if getent ahostsv4 "$host" >/dev/null 2>&1; then continue; fi
            ip="$(curl -fsS -m 10 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=${host}&type=A" | jq -r '[.Answer[]? | select(.type == 1) | .data][0] // empty' || true)"
            if printf '%s' "$ip" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
              echo "$ip $host" | sudo tee -a /etc/hosts >/dev/null
              echo "::warning::The runner could not resolve $host; pinned it to $ip from public DNS for this job."
            else
              echo "::warning::The runner could not resolve $host and the public lookup returned nothing; package installation will fail."
            fi
          done

      - name: PostgreSQL client for strict full-history replay
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Frozen evidence dependencies
        run: bun install --frozen-lockfile
      - name: Frozen snapshot application dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Chromium and operating-system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Real-stack SHA, isolation and publication guards
        run: bun test ./scripts/recruiter-real-ci.test.ts
      - name: Fresh real Supabase, strict history, Storage and 12 UI journeys plus 2 CAS probes
        run: node scripts/recruiter-real-ci-run.mjs
      - name: Validate public manifest and curated synthetic PNG only
        id: public_evidence
        if: always()
        run: node scripts/recruiter-real-ci-public.mjs
      - name: Redacted real-service evidence
        if: always() && steps.public_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-real-supabase-evidence
          path: |
            real-public/manifest.json
            real-public/errors.json
            real-public/images/*.png
          if-no-files-found: error
          retention-days: 7
