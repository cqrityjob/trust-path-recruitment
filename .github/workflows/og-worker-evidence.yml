name: Passport preview image — Cloudflare Worker runtime evidence

# ── WHY THIS IS A WORKFLOW OF ITS OWN ───────────────────────────────────
#
# Production serves the application from a Cloudflare Worker (the default Nitro
# preset, `cloudflare-module`). A Worker may not compile WebAssembly from bytes,
# has no file system for the application's assets and has a memory ceiling, so
# "it renders in Node" proves nothing about it. This job builds the application
# exactly as the default build does, serves THAT BUNDLE in workerd (Cloudflare's
# own runtime) and asks it for the personal preview image of a public share:
# first and later requests, a valid 1200×630 PNG, an unknown id, a revoked share,
# an expired one and a failed read.
#
# The database is a loopback stub that answers only `sp_get_social_share`, with
# synthetic people. The real project is never contacted.

on:
  pull_request:
    paths:
      - "src/lib/security-passport/og-image/**"
      - "src/routes/og.share.$publicId.ts"
      - "src/routes/s.$publicId.tsx"
      - "scripts/og-worker-*"
      - ".github/workflows/og-worker-evidence.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    name: Preview image in workerd (Cloudflare Worker runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build (default Cloudflare preset)
        run: bun run build

      - name: What the build produced
        run: |
          set -x
          ls -la
          find dist .output -maxdepth 3 2>/dev/null | head -80 || true
          find . -name 'wrangler.json*' -not -path './node_modules/*' | head
          find . -name 'wrangler.json' -not -path './node_modules/*' -exec sh -c 'echo "== $1"; head -c 1500 "$1"' _ {} \; | head -60
