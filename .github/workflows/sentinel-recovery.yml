name: Sentinel recovery regression
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/sentinel/**"
      # The shared academy route selects the Sentinel runner and report flow.
      - "src/routes/_authenticated.academy.*"
      - "e2e/sentinel-recovery.spec.ts"
      - "scripts/sentinel-session-state-check.ts"
      - "scripts/sentinel-recovery-stack.sh"
      - "scripts/fixtures/sentinel-browser-reset.sql"
      - ".github/workflows/sentinel-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentinel-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Sentinel recovery (synthetic local backend, desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Ubuntu archive DNS fallback
        run: |
          # GitHub-hosted runners have repeatedly failed to resolve Ubuntu's package
          # hosts ("Temporary failure resolving 'archive.ubuntu.com'") while every
          # other host resolved, which fails apt and Playwright's --with-deps before
          # a single test runs. When, and only when, the runner's own resolver
          # cannot resolve one of those hosts, look it up over public DNS and pin
          # it in /etc/hosts for this job. The hosts, the archive and apt's
          # signature verification are unchanged; if the public lookup fails too,
          # nothing is pinned and package installation fails exactly as before.
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if getent ahostsv4 "$host" >/dev/null 2>&1; then continue; fi
            ip="$(curl -fsS -m 10 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=${host}&type=A" | jq -r '[.Answer[]? | select(.type == 1) | .data][0] // empty' || true)"
            if printf '%s' "$ip" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
              echo "$ip $host" | sudo tee -a /etc/hosts >/dev/null
              echo "::warning::The runner could not resolve $host; pinned it to $ip from public DNS for this job."
            else
              echo "::warning::The runner could not resolve $host and the public lookup returned nothing; package installation will fail."
            fi
          done

      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bunx playwright install --with-deps chromium
      - name: Reproduce recovery on a disposable local stack
        run: bash scripts/sentinel-recovery-stack.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sentinel-recovery-failures
          path: test-results/
          retention-days: 7
