name: Sentinel recovery regression
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/sentinel/**"
      - "e2e/sentinel-recovery.spec.ts"
      - "scripts/sentinel-session-state-check.ts"
      - "scripts/sentinel-recovery-stack.sh"
      - "scripts/fixtures/sentinel-browser-reset.sql"
      - ".github/workflows/sentinel-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentinel-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Sentinel recovery (synthetic local backend, desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bunx playwright install --with-deps chromium
      - name: Reproduce recovery on a disposable local stack
        run: bash scripts/sentinel-recovery-stack.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sentinel-recovery-failures
          path: test-results/
          retention-days: 7
