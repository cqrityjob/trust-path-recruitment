name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and deterministic checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        continue-on-error: true
        run: bun run lint

      - name: Type-check
        run: bunx tsc --noEmit

      # scripts/ is outside the app tsconfig, which is how a guard kept reading
      # a field this codebase had deleted: it became undefined, the Set it fed
      # kept working, and the guard silently stopped excluding anything.
      - name: Type-check the Passport guard scripts
        run: bun run scripts:typecheck

      - name: CIE deterministic regression check
        run: bun run cie:check

      - name: Knowledge graph integrity check
        run: bun run kg:check

      # Proves the Security Competency Platform shares no item IDs, item
      # objects, options, mappings, scoring keys or constructs with Career
      # Guidance, and that the legacy definition is retired rather than
      # mutated (implementation directive section 5 and 6).
      - name: Security Competency / Career Guidance separation check
        run: bun run security-competency-separation:check

      # Proves the Career Discovery v3 instrument routes correctly across all
      # five adaptive paths, that every path still receives all 20 shared core
      # items, that adaptive and context answers are structurally unscored,
      # and that the version cannot be marked active while review gates are
      # outstanding (implementation directive section 23).
      - name: Career Discovery v3 instrument check
        run: bun run career-discovery:check

      # Question Refinement v3.2 rephrased twelve Career DNA stems, the C2
      # context prompt and six adaptive prompts. These two guards are the
      # halves of one claim and are worth nothing apart: the content check
      # asserts the approved sentences verbatim, the locked structure (2 + 22
      # + 4, 5 paths x 4), the option ids/loadings/role weights/report tags,
      # and that the 22 common items reintroduce no experience-dependent term
      # ("transaktion", "incident", "hela verksamheten", "compliance") that
      # only someone already working in security could answer. The
      # equivalence check replays nine fixed response sets through the whole
      # engine and compares every scoring output field-by-field against a
      # baseline frozen on pre-refinement main — so a wording edit that
      # silently moved a dimension, a loading or a ranking fails here rather
      # than reaching a candidate.
      - name: Career Discovery v3.2 content and readability check
        run: bun run career-discovery-v32-content:check

      - name: Career Discovery v3.2 scoring equivalence check
        run: bun run career-discovery-v32-equivalence:check

      # THE v3.1 ENGINE'S OWN GUARDS. Everything above proves properties of
      # the instrument and the result; these four prove the engine itself and
      # ran only on developer machines until now, so a change to a weight, a
      # threshold or a frozen persona could merge green. The domain check
      # re-parses the option-matrix migration to prove TypeScript and SQL
      # agree on every loading, and pins EXPECTED_WEIGHTS and the frozen
      # persona hashes. The professions check pins Layer 4: determinism, the
      # inclusion thresholds, stage dominating fit, no percentage ever
      # reaching a candidate, CID15 never contributing. The golden personas
      # run the whole pipeline over the 14-profession first-wave catalogue
      # for sixteen frozen personas. The recommendation check asserts every
      # persona receives a recommendation and that ordering and eligibility
      # stay separate. None of these reads the legacy 16-question
      # career-assessment engine, which stays retired rather than guarded.
      - name: Career Discovery v3.1 domain model check
        run: bun run career-discovery-v31:check

      - name: Career Discovery v3.1 profession matching check
        run: bun run career-discovery-v31-professions:check

      - name: Career Discovery v3.1 golden personas
        run: bun run career-discovery-v31-golden-personas:check

      - name: Career Discovery recommendation check
        run: bun run career-discovery-recommendation:check

      # THE REPORT A CANDIDATE READS BACK. A v3.1 snapshot must reach the
      # v3.1 renderer, the locale the candidate read in is stored with the
      # report, and completing the same answers twice yields an identical
      # snapshot. The two guards after it have no package.json alias and are
      # invoked by path on purpose -- adding one is a package.json change
      # this PR does not make: the report must render with no AI call at all
      # and an AI failure must degrade silently to the deterministic
      # explanation, and a frozen report must never re-render in the live UI
      # language, because a stored result has to read the same on every visit.
      - name: Career Discovery report render check
        run: bun run career-discovery-report:check

      - name: Career Discovery v3.1 AI-explanation fallback check
        run: bun run scripts/career-discovery-v31-ai-explanation-check.ts

      - name: Career Discovery v3.1 report locale guard
        run: bun run scripts/career-discovery-v31-locale-guard-check.ts

      # Answer-level profession differentiation. Every other Layer 4 guard
      # starts from a hand-written dimension vector, which proves the matcher
      # behaves and proves nothing about the instrument above it. This one
      # starts from the raw answers a candidate submits and asserts the
      # property the product is actually sold on: that a beginner who answers
      # operationally, one who answers technically and one who answers
      # investigatively receive materially different professions. It also pins
      # the ranking defects the Profession Recommendation Validation audit
      # found — order running on a saturated metric, a context bonus large
      # enough to move the headline recommendation, the ranked list and the
      # tier list disagreeing about a profession's career stage, and a
      # profession that could never be a "strong" match for anyone — each of
      # which passed every pre-existing guard.
      - name: Career Discovery profession differentiation check
        run: bun run career-discovery-profession-differentiation:check

      # Asserts the EXACT payload persistPublicV31Run sends to cd_evidence.
      # A NOT NULL violation on answer_tags emptied every save in the live
      # environment while the SQL suite passed, because the suite wrote its own
      # INSERT and omitted the column. This checks the shipping payload itself.
      - name: v3.1 cd_evidence payload check
        run: bun run v31-evidence-payload:check

      # ONE COMPLETED ATTEMPT = ONE CANONICAL RESULT. A candidate completed the
      # assessment signed out, read their report, then signed in and found
      # different career recommendations: the pre-login report was built in the
      # browser, which cannot read cd_professions, so it had no ranking at all.
      # Asserts there is exactly one builder and that both paths produce a
      # byte-identical snapshot from the same run.
      - name: Career Discovery canonical result check
        run: bun run career-discovery-canonical-result:check

      # THE PROMISES AROUND THE RANKING. The engine was correct and the report
      # still failed the candidate three ways: a failed catalogue or CIG read
      # was indistinguishable from "nothing is approved", so a dropped
      # connection issued an immutable report saying profession matching is
      # "not included in this version"; one 28-question instrument was
      # advertised as 5, 12-15 and 15 minutes on different surfaces, one page
      # contradicting itself; and the Career Card's no-ranking state offered
      # only the report that had no ranking. Also pins the fairness contract:
      # exactly which inputs may move a profession's rank.
      - name: Career Discovery recommendation integrity check
        run: bun run career-discovery-recommendation-integrity:check

      # The anonymous -> account -> saved-result conversion contract. The
      # pilot audit found the journey the public product advertises ending at
      # "the assessment isn't open yet", with the finished run discarded:
      # product availability and result ownership had been collapsed into one
      # gate, and the wrong one was resolved first. These prove the separation
      # holds, that a claim is idempotent and unstealable, and that the claim
      # URL never becomes an open redirect.
      - name: Career Discovery conversion contract check
        run: bun run career-discovery-conversion:check

      - name: Career Discovery anonymous claim check
        run: bun run career-discovery-claim:check

      - name: Public assessment auth and buffer check
        run: bun run public-assessment-auth:check

      # ONE FACT, ONE WRITER, AND A JOURNEY THAT MAY CHANGE. Current
      # profession used to be writable from both "Din karriärprofil" and the
      # Passport's "Mina uppgifter", into two tables, with nothing keeping
      # them in step. Asserts the second writer is gone, that the readiness
      # engine stays pure and can never derive readiness from Career DNA,
      # that an unknown situation can never produce a "possible next step",
      # and that this application phase names no object its expand migration
      # introduces -- which is what lets the two halves release separately.
      - name: Career Journey and canonical profile check
        run: bun run career-journey:check

      # The Career Card derives from that same canonical ranking (no profession
      # picker), and every format fits its canvas in both locales — the layout
      # collisions this replaces were all found by eye, after shipping.
      - name: Career Card check
        run: bun run career-discovery-career-card:check

      # The Security Passport guards. They ran on developer machines but not
      # here, which meant the invariants they encode were only ever checked by
      # whoever remembered to run them.
      - name: Passport separation check
        run: bun run passport-separation:check

      - name: Passport fixture and copy-parity check
        run: bun run passport-fixture:check

      # THE PLUMBING MAY NOT REACH THE TRUST SURFACES. Independent pilot
      # testing found the trust MODEL sound -- issuer separate from verifier,
      # current trust separate from withdrawn -- and the implementation
      # leaking underneath it: the credential symbol printed truncated
      # database enums ("SE_P", and "OV_T" for two different credentials) on
      # the private overview, the Passport Card, the recipient page and the
      # exported PNG; the recognition panel printed "v1-prototype"; Career
      # Discovery printed its definition version beside a candidate's own
      # result and baked it into the shareable Career Card. Renders the real
      # components and asserts the markup, plus a scan scoped to user-facing
      # components, routes and copy tables.
      - name: Trust surface check
        run: bun run trust-surface:check

      # The application modal. A centred fixed dialog with no height cap is
      # clipped at BOTH ends once its content outgrows the viewport, and the
      # body scroll lock means no gesture reaches either -- measured at
      # 375x667 as a 911px dialog with the submit button 97px below the fold.
      # That is a candidate who cannot finish an application, so it is a
      # release gate, not a lint.
      - name: Application dialog scroll check
        run: bun run application-dialog-scroll:check

      # The candidate dashboard. Two of its properties are one CSS class or one
      # component swap from silently regressing: a completed Career Discovery
      # report staying reachable, and the product grids not stretching to the
      # tallest card (which is what filled the old dashboard with empty panels).
      - name: My Career dashboard check
        run: bun run my-career-dashboard:check

      # The guided experience, asserted against rendered markup rather than
      # source: exactly one recommendation is marked primary and it is the one
      # the ranking engine returned, the rest stay reachable, no call to action
      # falls back to "Continue", the Career Card is offered with one verb, no
      # slug or jurisdiction code reaches the screen, and /my-career/profile
      # names itself instead of mirroring the dashboard.
      - name: My Career experience check
        run: bun run my-career-experience:check

      # The professional identity engine. Every case is a mutation: hold one
      # credential, assert the title the product must NOT grant is absent. Two
      # are load-bearing — VU1 alone must never produce Väktare, and
      # ordningsvakt training must never produce Ordningsvakt — because the
      # server used to label every holder "Väktare" from a hardcoded string.
      - name: Passport identity engine check
        run: bun run passport-identity-engine:check

      # Keeps the derivation rules in exactly one place: the mirror used by the
      # fixtures must match the migration that seeds sp_professional_titles,
      # and no component may map a credential code to a professional title.
      - name: Passport title derivation guard
        run: bun run passport-title-derivation:check

      # What the form asks for must be what the database will accept. Adding
      # requires_scope to the skyddsvakt approval made the database refuse a
      # claim the form could not supply, in a market that is live — this is the
      # check that would have caught it.
      - name: Passport credential form contract
        run: bun run passport-credential-form:check

      # The four defects a real tester found in the live pilot, asserted against
      # the RENDERED markup rather than against the rules behind it. The rules
      # have their own checks; this is the one that would have caught a title
      # the domain called controlled while the component still drew a text box.
      - name: Passport pilot bug fix #1 check
        run: bun run passport-pilot-bugfix:check

      # The six questions that build a Passport. Removing the onboarding tab in
      # 9a150a6 left them with no candidate-facing entry point at all once
      # onboarding was finished -- the holder could not read, let alone correct,
      # their own name, profession, country, current role or declaration. This
      # renders the restored editor and asserts that all six are present and
      # answerable, that the two which are domain rows keep exactly one writer,
      # and that saving a self-reported answer cannot reach a credential, an
      # employment record or a verification state.
      - name: Passport profile basics check
        run: bun run passport-profile-basics:check

      # One person, one Passport, several MARKET profiles. The entry page used
      # to render a literal ["VU1","VU2","OV","SV"] regardless of where the
      # holder said they work, so a Dubai holder was offered Swedish regulated
      # credentials to register. This asserts on the RENDERED markup that a
      # closed market offers nothing, that no market's catalogue ever stands in
      # for another's, and that a market change mutates no claim.
      - name: Passport market profiles check
        run: bun run passport-market-profiles:check

      # The application deploys when main moves; a migration is applied when
      # somebody asks. Between those two events the code can be talking to a
      # schema that has never heard of what it needs -- which took the whole
      # Passport down, not just the pilot feature that introduced it.
      # release-parity --release already predicted this and did not help,
      # because it is a RELEASE gate and the deploy happens at MERGE.
      - name: Passport schema-drift resilience check
        run: bun run passport-schema-drift:check

      # release-state.json must keep describing the hosted database it claims
      # to describe. When PR #131 advanced the evidence baseline to the owner
      # Supabase bootstrap, 28 frontier entries below that baseline became
      # redundant with migrations-policy.json and release-parity started
      # failing on main -- and nobody noticed, because this check ran nowhere.
      # It is the non-release form: it reports pending migrations a branch
      # ships alongside their code (expected) and fails only on genuinely
      # stale or unclassified bookkeeping. The --release form remains the
      # deploy gate.
      - name: Release parity bookkeeping check
        run: bun run release-parity:check

      # THE MERGE GATE.
      #
      # release-parity --release computes the right thing at the wrong moment:
      # it is a RELEASE gate, and with Lovable the deploy happens at MERGE. A
      # gate placed after the thing it guards is a report, not a gate — which
      # is why it "already predicted this and did not help" above.
      #
      # This runs on the pull request and fails closed: application code that
      # depends on a migration not yet recorded as applied on the owner
      # Supabase project cannot merge. A feature needing both is split into a
      # schema release and an application release automatically, so the order
      # does not depend on anybody remembering it.
      #
      # On main this reports the standing state. If it is red on main, that is
      # not a broken check — it means main's code is asking the database for
      # something that is not there yet, and the migrations must be applied.
      - name: Schema-first release contract
        run: bun run schema-first-release:check

      # Five defects this repository actually shipped: seven interview routes
      # highlighting "Tester & bedömningar"; `ai_enabled || true` rendering an
      # AI control that could only fail; the provider NAME stored as the model
      # id; the new-interview selector built from a generic RLS read so it
      # offered packs create then refused; and copy demanding a
      # "pilotmedgivande" the owner decision had removed. Source-only and
      # deterministic; it self-tests by failing when any of them is restored.
      - name: Interview UX and safety contract guard
        run: bun run interview-ux-contract:check

      # Owner decision 3 forbids claiming verification with an authority,
      # government endorsement, cross-border equivalence or Arabic legal
      # review. It looks for CLAIMS, not for authority names — truthful
      # limiting language like "Not verified directly with SIA" must pass, and
      # the guard self-tests both directions on every run.
      - name: Passport regulatory-claim guard
        run: bun run passport-regulatory-claim:check

      # A correct payload can still meet a screen that does not render it. The
      # employer's application view goes through RecipientPassportCard, which
      # carried the exact scope in its payload and never showed it — so this
      # asserts what each audience SEES, not only what the database emits.
      - name: Passport scope surface check
        run: bun run passport-scope-surface:check

      # Production reported a page-wide "something went wrong" over a
      # verification queue that was working: four unrelated operations shared
      # one error string that nothing cleared on success. The browser test for
      # it needs an authenticated platform admin and therefore skips in CI, so
      # this source guard is what actually defends the invariant.
      - name: Passport error-scope check
        run: bun run passport-error-scope:check

      # Four defects with one shape: something happened -- a reviewer refused a
      # credential, a claims query was rejected, a decision log could not be
      # read -- and the interface presented the result as a well-formed
      # nothing. A rejection that vanished, "0 verifierade" produced by a
      # broken query, a verified credential with no decision behind it, and a
      # refusal with no reason in it. This renders the candidate's panel and
      # asserts on the markup, because every one of them is a property of what
      # a person SEES.
      - name: Passport decision truthfulness check
        run: bun run passport-decision-truthfulness:check
      - name: Passport reviewer decision quality and trust attribution
        run: bun run passport-reviewer-decision:check

      # Employment confirmation, rendered for both people in the exchange. The
      # candidate must read "Bekräftad av Company X" and never "Verifierad av"
      # for something no reviewer read; the employer must be told the message
      # is required for the two outcomes the database refuses without one, and
      # must never be offered a control on their own request that
      # sp_verifier_decide will refuse.
      - name: Passport employer employment verification
        run: bun run passport-employer-verification:check

      # The way INTO employment confirmation. A pilot found the exchange itself
      # working and the picker in front of it offering unrelated organisations,
      # alphabetically, with the first one already selected -- two clicks from
      # page load, a company that had never heard of the candidate could be
      # asked to confirm their employment. This renders the replacement and
      # asserts that nothing is preselected, that choosing is not sending, that
      # a failed search and an empty one say different sentences, and that
      # "my employer is not on CQrityjob" promises no invitation. The
      # eligibility, duplicate, self-verification and tenant rules are asserted
      # against the migrations, because a component cannot enforce them.
      - name: Passport employer matching check
        run: bun run passport-employer-matching:check

      # ── THE EMPLOYER UAT GUARDS ──────────────────────────────────────────
      #
      # Twelve findings from one customer, closed across five subsystems. Each
      # fix has a guard; none of them ran anywhere but a developer's machine,
      # which is how a fix gets quietly undone by somebody who never saw the
      # feedback. The reconciliation check is the index over the other five and
      # fails if any of them stops being registered.

      # "Stäng" and "Arkivera" both set status='archived'. Asserts the
      # duplicate path stays gone, that a delete goes through
      # jobs_delete_draft() rather than the jobs table, and that no employer
      # surface is back to window.confirm().
      - name: Employer job lifecycle check
        run: bun run employer-job-lifecycle:check

      # There is one hire bridge, it lives in set_application_status(), and a
      # second one must never appear. A duplicate bridge is how one human
      # becomes two employment records.
      - name: Employer hire continuity check
        run: bun run employer-hire-continuity:check

      # "Annat" and "Ej angivet" are different answers, and neither may reach
      # family_id or profession_slug -- both are exact-match filters on the
      # public job search.
      - name: Employer Other/Annat taxonomy check
        run: bun run employer-other-taxonomy:check

      # The AI proposal contract, and the fact that nothing executes it. Fails
      # if a provider call or credential appears: enabling AI review is an
      # owner decision with a calibration step, not a code change.
      - name: Review proposal contract check
        run: bun run review-proposal-contract:check

      # What a candidate is told, and what they are never told: no score, no
      # assessment content, no reason derived from an assessment, and nothing
      # at all for the internal "under review" state.
      - name: Candidate notification check
        run: bun run candidate-notification:check

      # The index over all twelve points and the nine guards they delegate to.
      - name: Employer UAT reconciliation check
        run: bun run emma-uat:check

      # Tester & bedömningar. Two rules, both of which fail silently: a card
      # that reports work must be the control that opens it (the dead
      # "Svar att granska: 10" card is what this rebuild came from), and this
      # area is recruitment only (merging it with competence development is
      # what made "Kandidater" a filter instead of a page). Also holds the
      # vocabulary, the pseudonymity of the list, and the keyboard/touch
      # properties of the controls.
      - name: Recruitment assessment UX check
        run: bun run recruitment-assessment-ux:check

      # The CLIENT half of the assessment loop. The database half is proven by
      # supabase/tests/employer_vaktare_journey_test.sql — incomplete submit,
      # double submit, resume, the release gate and cross-tenant refusal are all
      # asserted there and are not repeated. What this covers is what no schema
      # test can reach: that two saves for one answer cannot land out of order
      # (it RUNS the queue, and asserts the unqueued case still inverts), that
      # submission drains the writes still in the air, that a submission with
      # answers missing names them and routes to one instead of offering to
      # retry a call that will be refused again, that "Saved" is set by the
      # server's reply, that an already-shared brief is not reported as a
      # failure, and that recruitment is never addressed in workforce words.
      - name: Assessment pilot reliability check
        run: bun run assessment-reliability:check

      # The same run, asserted against RENDERED markup. Every panel it covers
      # is a state nobody reaches by hand — a save only reports a failure when
      # the network drops, the missing-answers panel only appears on an
      # unfinished submission, and the recruitment ending only appears to a
      # candidate. States like that go wrong quietly, because the only way to
      # look at one is to break something on purpose first.
      - name: Assessment participant panels render check
        run: bun run assessment-panels-render:check

      # The source-level half of the security invariants. It replays every
      # migration's grants, policies and function definitions in filename order
      # and reports only what SURVIVES, so it fails on a SECURITY DEFINER
      # function left unpinned or reachable by anon, or on a WITH CHECK (true)
      # policy over a table that carries a user_id. The other half runs in the
      # database job, against a replay that reproduces Supabase's own default
      # privileges -- see supabase/tests/security_hardening_test.sql.
      # Interview Intelligence Phase 1. The database suite proves these
      # properties of the SCHEMA; this proves them of the REPOSITORY, which is
      # the half a schema test cannot reach — a prohibited column is added by
      # editing a migration and an AI provider is enabled by editing a source
      # file. It asserts Q1–Q8 verbatim and in order, the complete 0–4 anchor
      # set with level 0 never aggregable, that no total/score/ranking/
      # threshold/recommendation identifier exists anywhere in the domain, that
      # no AI provider marker appears, and that no employer surface links to it.
      - name: Interview Intelligence pack contract check
        run: bun run interview-pack-contract:check

      # The same invariants, one layer up: what the Role Interview Builder
      # actually RENDERS. Asserts that every required state (loading, error,
      # empty, permission-denied, incomplete draft, published, suspended,
      # retired, unresolved mapping) draws visible text, that no state is
      # carried by colour alone, that there is no red/green candidate verdict
      # pair anywhere, that level 0 is explained rather than shown as the
      # bottom of a scale, and that the UI transition model matches the
      # database guard exactly — a screen offering a move the database refuses
      # is a bug the type system cannot catch.
      - name: Interview Intelligence pack render check
        run: bun run interview-pack-render:check

      # The AI evaluation harness. Runs 16 synthetic gold cases through the REAL
      # orchestrator -- same schema validation, same policy validator, same
      # citation checks the product uses -- and gates on per-metric floors.
      # The safety metrics are absolute: one prohibited output, one protected-
      # information leak, one followed prompt injection or one hiring
      # recommendation fails the build. There is deliberately no composite
      # quality score, because averaging safety against recall is how a safety
      # regression gets hidden by an unrelated improvement.
      - name: Interview Intelligence AI evaluation
        run: bun run interview-ai-eval:check

      # The Phase 2 source contract. The database suites prove these of the
      # SCHEMA and the AI evaluation proves them of the ENGINE'S OUTPUT; this
      # proves them of the REPOSITORY -- the half neither can reach. It asserts
      # no prohibited identifier exists anywhere in the runtime, the AI engine
      # or the employer UI; that AI proposals and confirmed evidence remain
      # separate tables with no client write path between them; that the
      # TypeScript AI Task Registry and the database registry agree on every
      # task key and version; that no provider credential is committed and the
      # shipped default is the deterministic engine; and that the policy
      # validator still fires on violations AND stays quiet on the product's own
      # legitimate wording -- a validator that flags correct output gets
      # switched off, so both directions are tested.
      - name: Interview Intelligence runtime contract check
        run: bun run interview-runtime-contract:check

      # The context an interview inherits from its application. Half of it runs
      # buildInterviewContext against typed fixtures -- released assessment, no
      # assessment, uploaded CV, no application -- and half of it reads the
      # source, because the requirements that matter most here are ABSENCES:
      # no reviewer notes, no Passport material, no service-role client, no
      # write of any kind, and no wording that ranks or judges a candidate.
      # An absence cannot be exercised, only inspected.
      - name: Interview context bridge check
        run: bun run interview-context-bridge:check

      # Who may LOCK a candidate interview report. A pilot walkthrough was
      # shown an active "Slutför rapporten" button, clicked it, and was refused
      # by the database -- the governance rule was right and the screen was
      # lying. This renders both branches of the finalisation block and asserts
      # that a member sees no button, no disabled button, and no error state,
      # while the owner/admin rule in scp_iv_finalise_report is untouched.
      # The database half of that claim -- a member calling the RPC directly is
      # still refused with 42501 -- needs a live stack and runs locally via
      # interview-finalisation-rpc:check.
      - name: Interview finalisation capability check
        run: bun run interview-finalisation-capability:check

      # PR19: the recruiter's four-step journey. Pilot recruiters met seven
      # navigation steps named for screens, TRUST stage banners above their
      # work, raw enum values and provider modes on customer screens, and no
      # single obvious next action. This renders the workflow shell, the
      # status chip and the next-step action and reads them for what they
      # say -- four stages, driven by the runtime status, one action per
      # stage -- and reads the source for what a render cannot reach: no raw
      # identifier on a recruiter screen, TRUST only as method support,
      # Q1-Q8 still verbatim, follow-ups subordinate, the PR18 context and
      # the finalisation boundary intact.
      - name: Interview recruiter workflow check
        run: bun run interview-recruiter-workflow:check

      # The real model adapter, proved against a fake transport with no
      # credential and no network. Transport failures retry a bounded number of
      # times; a returned-but-unusable answer is NEVER retried, because
      # resampling until the model says something acceptable manufactures the
      # appearance of quality; the same logical request always carries the same
      # idempotency key; and the credential cannot reach a browser.
      - name: Interview Intelligence AI provider adapter
        run: bun run interview-ai-provider:check

      # PR20: what the recruiter confirms is exactly what the assessor and the
      # report rely on -- bound to its case, idempotent under retry, stale-write
      # safe, honest about failed reads, and neutral about missing material.
      # The database half runs in the database job.
      - name: Interview evidence reliability guard
        run: bun run interview-evidence-reliability:check

      # The answer key must not be writable by the thing it grades. This proves
      # the gold dataset imports nothing, computes no expectation, and states
      # its authorship honestly -- currently 0 of 22 cases reviewed by anyone
      # independent, which means it can prove a regression and cannot prove
      # correctness. The check prints that limitation on every run so no report
      # can quote the pass rate without it.
      - name: Interview Intelligence gold dataset independence
        run: bun run interview-gold-independence:check

      # The legacy generated chain (Lovable's content-identical and partially
      # overlapping re-issues) was retired to supabase/archive/parked-migrations
      # on 2026-08-28. This guard now tolerates NO content-equivalent pair in
      # the active path, and fails if parked content returns under any name.
      - name: Migration content-duplicate check
        run: bun run migrations-duplicate:check

      # One Lovable project and three Supabase identities have previously been
      # confused. During the owner-backend transition this credential-free
      # guard keeps the shipping app on the current live backend, records the
      # new owner project only as an empty candidate, permanently excludes the
      # stale project, and refuses any hosted write workflow before the
      # bootstrap/cutover PR explicitly enables one.
      - name: Backend deployment target lock
        run: bun run backend-target-lock:check

      # The backend lock above proves the DATA plane names the owner project.
      # This proves the same about the AUTH plane: Google sign-in broke in the
      # 2026-08-29 cutover because it went through the Lovable Cloud OAuth
      # broker rather than the project's own Supabase Auth, so it followed the
      # disconnected backend while email/password followed VITE_SUPABASE_URL.
      - name: Authentication provider target lock
        run: bun run auth-provider-target:check

      - name: SQL security guard
        run: bun run sql-security:check

      # A type-check is not a build. This compiles the real production bundle,
      # which is where route generation, SSR entry points and bundler-level
      # failures actually surface.
      # The Security Career Center was rebuilt from eleven sections to six.
      # This guard holds the shape that made it a product rather than a
      # catalogue of unfinished content: the six sections in order, the four
      # merged discovery sections and four empty-content panels staying
      # retired, publishability computed from the guides themselves (so a
      # stub cannot be carded, linked or reached by direct URL), every
      # displayed count derived, the explorer's URL round-trip / clear-all /
      # zero-result recovery, career routes that assert no progression the
      # data does not record, the translated competency label, SV/EN parity
      # and the accessibility contract.
      - name: Security Career Center check
        run: bun run career-center:check

      # ONE PERSON, ONE PROFESSIONAL IDENTITY. Four pure engines decide what
      # somebody is told on their own home page and what a generated CV may
      # say about them, and each is one edit from a silent regression: a
      # completeness weight that moved without a version change, an action
      # promoted above an employer's invitation, a readiness rule relaxed
      # until somebody with no history gets a CV written for them, and the
      # anti-fabrication sweep itself. The sweep is tested from BOTH
      # directions on every run -- a validator that flags the product's own
      # honest output is a validator somebody switches off.
      - name: Professional identity and AI CV contract check
        run: bun run professional-identity:check

      # APPLYING WITH THE CV THIS PLATFORM ALREADY HOLDS. Pilot testing found
      # a candidate who had built a CQrityjob CV being required, on a
      # CQrityjob job, to print it to PDF and upload it back. The fix has a
      # narrow correct shape and several ways to be quietly wrong: an
      # eligibility rule stated in the interface but not in the database, a
      # snapshot that carries a target-job advert from a different employer,
      # a stored copy that keeps claiming a verifier after the confirmation
      # was revoked, a failed CV read rendered as "you have no CV", or an
      # upload path narrowed on the way past. Each of those is asserted here,
      # against the contract and against the rendered markup. The boundaries
      # themselves -- one candidate's CV against another's, one employer's
      # application against another's -- are proved by executing them, in
      # supabase/tests/job_application_cv_source_test.sql.
      - name: CQrityjob CV as an application source check
        run: bun run cv-application-source:check

      # THE SIGNED-IN CANDIDATE'S CHROME AND VOCABULARY. Until PR 3 the
      # product had one navigation -- the marketing site's -- and served it
      # to people inside their own workspace: six items, none of them the
      # candidate's career, "Kontakt" twice on every page, and Security
      # Passport absent from the chrome at every width. The fix is a
      # four-item application navigation rendered from one array, and every
      # property that makes it work is invisible to the type checker: one
      # link per product on BOTH viewports, no marketing item following
      # anybody in, current location surviving nested routes,
      # /passport-attestations (an employer surface) staying out of the
      # holder's Passport tab, a current-item treatment that is never
      # colour alone, and one name per product across the workspace.
      # Asserted against rendered markup and against the generated route
      # table, so a nav item pointing at a route that does not exist fails
      # here rather than in somebody's browser.
      - name: Candidate app navigation and terminology check
        run: bun run candidate-app-navigation:check

      # The public header's entry points -- one door in, one way to create
      # an account, "Arbetsgivare" as information and never as an action.
      # This guard has existed since the unified-account work and was never
      # wired into CI, so the file it protects has been changing unguarded.
      # It guards the same component as the check above.
      - name: Public header entry-point check
        run: bun run header-entry:check

      # THE EMPLOYER FRONT DOOR. An independent pilot audit registered an
      # employer exactly as a customer would, and the organisation was never
      # created: `ensureMyEmployerCompanyFromSignup` ran as a side effect of
      # RENDERING /employer, and nothing took the registrant there, so the
      # admin moderation queue stayed empty until the tester typed the URL by
      # hand. Everything downstream -- pending status, the queue, the approval
      # RPC, the workspace -- already worked. This guard holds the one link
      # that was missing: provisioning is a lifecycle event in the
      # authenticated shell, one predicate decides who has an organisation
      # intent, a provisioning FAILURE is never reported as "you have no
      # organisation", and an organisation under review is discoverable from
      # the account menu wearing its status. None of it is visible to the type
      # checker.
      - name: Employer registration and activation check
        run: bun run employer-registration:check


      - name: Production build
        run: bun run build

  # ---------------------------------------------------------------------------
  # Database job.
  #
  # Runs against a throwaway PostgreSQL 16 service container -- never against
  # any real, staging or production database. No credentials beyond the
  # container's own throwaway password exist in this job, and it holds no
  # secrets, so it is safe to run on pull requests from forks.
  #
  # It proves the five things a lint/typecheck job structurally cannot:
  #   1. the full migration history replays in order on a clean database
  #   2. A1 applies before A2, and A2's changes actually landed
  #   3. all 83 domain/RLS assertions execute and pass
  #   4. the documented rollback restores the pre-PR-A state
  #   5. historical assignment rows and scores survive both directions
  # ---------------------------------------------------------------------------
  database:
    name: Migration replay, RLS and rollback tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      # Report every failing suite in one run instead of stopping at the first.
      # The suites run as one long sequence and the job still fails on any
      # failure -- this only changes how much of the picture a single run gives
      # a reviewer. Without it the later suites (the whole Security Passport
      # set among them) stay invisible while an earlier suite is red.
      DB_TEST_CONTINUE_ON_SUITE_FAILURE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # GitHub's ubuntu-latest runner already ships the PostgreSQL client.
      # Avoid apt-get here: external package-index/network stalls can block the
      # entire database gate before any migration test has even started.
      - name: Verify PostgreSQL client
        run: |
          command -v psql >/dev/null 2>&1 || { echo "psql is missing from the runner" >&2; exit 1; }
          command -v pg_isready >/dev/null 2>&1 || { echo "pg_isready is missing from the runner" >&2; exit 1; }
          psql --version
          pg_isready --version

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      # Replays every active migration in order under the STRICT replay
      # contract — every file must apply cleanly, there is no expected-failure
      # allowlist — then runs the full assertion-suite sequence and the
      # rollback verification, failing the job on any migration failure, any
      # assertion failure or a shortfall in assertion count.
      - name: Migration replay + database assertions + rollback verification
        run: bash scripts/db-test.sh
