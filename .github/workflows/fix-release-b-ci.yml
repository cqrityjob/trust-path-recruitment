name: Fix Release B CI guard

on:
  push:
    branches:
      - claude/cqrityjob-cv-persistence-release-b
    paths:
      - .github/workflows/fix-release-b-ci.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/cqrityjob-cv-persistence-release-b
      - name: Apply minimal generated-types exclusion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/professional-identity-check.ts')
          s = p.read_text()
          needle = '  const namingIt = allSources.filter((f) => /cv_documents/.test(codeOf(f)));'
          replacement = '  // Generated Supabase schema types describe hosted schema; they are not a runtime dependency.\n  // Keep this aligned with release-parity-check, which excludes the same generated file.\n  const runtimeSources = allSources.filter(\n    (f) => f !== "src/integrations/supabase/types.ts",\n  );\n  const namingIt = runtimeSources.filter((f) => /cv_documents/.test(codeOf(f)));'
          if needle not in s:
              raise SystemExit('expected namingIt line not found')
          s = s.replace(needle, replacement, 1)
          needle2 = '  const importers = allSources.filter((f) => /cv-store\\.functions/.test(codeOf(f)));'
          replacement2 = '  const importers = runtimeSources.filter((f) => /cv-store\\.functions/.test(codeOf(f)));'
          if needle2 not in s:
              raise SystemExit('expected importers line not found')
          s = s.replace(needle2, replacement2, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- scripts/professional-identity-check.ts
      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "CQrityjob CI Fix"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/professional-identity-check.ts
          git commit -m "fix(ci): exclude generated Supabase types from CV runtime guard"
          git push origin HEAD:claude/cqrityjob-cv-persistence-release-b
